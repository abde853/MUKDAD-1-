<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>محل مقداد - مواد الحلويات والتغليف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--gold:#c9a227;--gold2:#f7e2a0;--gold3:#e8c766;--bg:#05060a;--ink:#0b0e17;--txt:#f6f1e3;--mut:#9d998b;--green:#4ade80;--red:#fb7185;--line:rgba(247,226,160,.22)}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Cairo',Tahoma,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;height:100dvh}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 30%,rgba(0,0,0,.6) 100%),linear-gradient(to bottom,rgba(0,0,0,.7),transparent 24%,transparent 50%,rgba(0,0,0,.88))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.glass{background:linear-gradient(rgba(13,16,25,.72),rgba(13,16,25,.72)) padding-box,linear-gradient(135deg,rgba(247,226,160,.65),rgba(247,226,160,.08) 45%,rgba(201,162,39,.45)) border-box;border:1px solid transparent;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3)}

/* header */
.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--gold2),var(--gold) 60%,#8a6d12);display:grid;place-items:center;font-family:'Amiri',serif;font-size:30px;font-weight:700;color:#1b1403;box-shadow:0 6px 22px rgba(201,162,39,.45),inset 0 1px 0 rgba(255,255,255,.5);position:relative}
.logo::after{content:"";position:absolute;inset:3px;border-radius:12px;border:1px solid rgba(27,20,3,.25)}
.brand b{display:block;font-family:'Amiri',serif;font-size:23px;line-height:1.1;background:linear-gradient(90deg,var(--gold2),var(--gold3),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-size:11px;color:var(--mut);letter-spacing:.2px}
.chip{border-radius:99px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--gold2)}
.modes{position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:50%;transform:translateX(-50%);z-index:5;display:flex;border-radius:99px;padding:4px;gap:2px}
.modes button{padding:9px 20px;border-radius:99px;font-size:13px;font-weight:700;color:var(--mut);transition:.25s;white-space:nowrap}
.modes button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;box-shadow:0 4px 14px rgba(201,162,39,.4)}
.ai{position:absolute;top:calc(env(safe-area-inset-top) + 126px);left:50%;transform:translateX(-50%);z-index:5;padding:4px 13px;border-radius:99px;font-size:11px;color:var(--mut);white-space:nowrap;transition:opacity .6s}

/* frame */
.frame{position:absolute;left:50%;top:45%;width:min(68vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:3;transition:transform .3s}
.frame i{position:absolute;width:38px;height:38px;border:3px solid var(--gold2);filter:drop-shadow(0 0 7px rgba(247,226,160,.6));transition:border-color .25s}
.frame i:nth-child(1){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:20px}
.frame i:nth-child(2){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:20px}
.frame i:nth-child(3){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:20px}
.frame i:nth-child(4){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:20px}
.frame u{position:absolute;left:8%;right:8%;height:2px;top:0;background:linear-gradient(90deg,transparent,var(--gold2),transparent);box-shadow:0 0 16px var(--gold2);animation:scan 2.2s ease-in-out infinite;text-decoration:none}
@keyframes scan{0%,100%{top:6%;opacity:.15}50%{top:94%;opacity:1}}
.frame.hit{animation:pulse .5s ease}
.frame.hit i{border-color:var(--green);filter:drop-shadow(0 0 10px rgba(74,222,128,.8))}
.frame.hit u{background:linear-gradient(90deg,transparent,var(--green),transparent);box-shadow:0 0 16px var(--green)}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.045)}100%{transform:translate(-50%,-50%) scale(1)}}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);z-index:5;display:flex;flex-direction:column;gap:14px}
.card{border-radius:28px;padding:18px 20px;min-height:124px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 50px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.3);position:relative;overflow:hidden;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;top:-60%;left:-30%;width:60%;height:220%;background:linear-gradient(100deg,transparent,rgba(247,226,160,.08),transparent);transform:rotate(12deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}
@keyframes rise{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.st{display:none}.st.on{display:block}
.idle{text-align:center;color:var(--mut);font-size:13.5px;line-height:1.9}
.idle b{display:block;color:var(--gold2);font-size:17px;margin-bottom:2px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:99px;margin-bottom:8px}
.tag.live{color:var(--green);background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.32)}
.tag.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.tag.hold{color:var(--gold2);background:rgba(247,226,160,.09);border:1px solid rgba(247,226,160,.3)}
.tag.saved{color:#1a1405;background:linear-gradient(135deg,var(--gold2),var(--gold));border:0}
.tag.no{color:var(--red);background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.32)}
.fname{font-size:19px;font-weight:700;word-break:break-word;line-height:1.45;padding-inline-end:34px}
.frow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;gap:10px}
.price{font-size:46px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff3c4,var(--gold3) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px rgba(201,162,39,.35))}
.price small{font-size:17px;font-weight:700;margin-inline-start:7px}
.stock{font-size:12px;color:var(--mut);text-align:left}
.stock b{color:var(--txt);display:block;font-size:15px}
.minibtn{margin-top:12px;font-size:12px;font-weight:700;color:var(--gold2);padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:rgba(247,226,160,.06)}
.xclose{position:absolute;top:12px;left:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--mut);background:rgba(255,255,255,.06);border:1px solid var(--line);z-index:2}
.controls{display:flex;justify-content:space-between;align-items:center}
.side{width:60px;height:60px;border-radius:21px;display:grid;place-items:center;font-size:24px}
.shutter{width:88px;height:88px;border-radius:50%;padding:5px;background:conic-gradient(from 200deg,var(--gold2),var(--gold),#7a5f10,var(--gold2));box-shadow:0 10px 34px rgba(201,162,39,.5);transition:transform .12s}
.shutter:active{transform:scale(.91)}
.shutter span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1a1f2e,#07080d);font-size:30px;border:3px solid #07080d}

.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.flash.on{opacity:.7}
.back{position:absolute;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:.25s;z-index:10}
.back.on{opacity:1;pointer-events:auto}

/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;border-radius:30px 30px 0 0;display:flex;flex-direction:column;transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:linear-gradient(#0e1220,#0b0e17) padding-box,linear-gradient(180deg,rgba(247,226,160,.55),rgba(247,226,160,.06)) border-box;border:1px solid transparent;border-bottom:0;max-height:90dvh}
.sheet.on{transform:none}
.shbody{padding:16px 18px 6px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.shfoot{padding:8px 18px calc(env(safe-area-inset-bottom) + 16px)}
.grab{width:44px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:18px;margin-bottom:12px;color:var(--gold2);font-family:'Amiri','Cairo',serif;font-size:22px}
.thumbs{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.thumbs img{width:58px;height:58px;border-radius:14px;object-fit:cover;border:1px solid var(--line)}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input[type=text],input[type=search]{width:100%;background:#141929;border:1px solid var(--line);border-radius:15px;padding:14px;color:var(--txt);font:inherit;font-size:16px}
input:focus{outline:2px solid var(--gold);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{min-height:20px;margin-top:10px;font-size:13px;font-weight:700;color:var(--red)}
.pbtn{width:100%;padding:16px;border-radius:18px;font-size:17px;font-weight:900;color:#1a1405;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 8px 26px rgba(201,162,39,.4)}
.pbtn:active{transform:scale(.98)}
.gbtn{width:100%;margin-top:10px;padding:12px;border-radius:15px;font-size:13px;font-weight:700;border:1px solid var(--line);background:#141929}
.gbtn.red{color:var(--red)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* inventory */
.inv{position:absolute;inset:0;z-index:12;background:radial-gradient(circle at 50% -10%,#151a2b,#05060a 60%);transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 14px 14px}
.inv.on{transform:none}
.invh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.invh h2{font-family:'Amiri','Cairo',serif;font-size:24px;color:var(--gold2)}
.x{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:18px}
.list{flex:1;overflow:auto;margin-top:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.it{display:flex;gap:12px;align-items:center;border-radius:20px;padding:10px;text-align:right;width:100%}
.it img{width:62px;height:62px;border-radius:15px;object-fit:cover;background:#000}
.it .n{flex:1;min-width:0}
.it .n b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .n span{font-size:12px;color:var(--mut)}
.it .p{font-weight:900;font-size:18px;color:var(--gold2)}
.empty{text-align:center;color:var(--mut);padding:60px 20px;line-height:2}

/* loader */
.loader{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 35%,#171c30,#05060a 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;transition:opacity .6s}
.loader.off{opacity:0;pointer-events:none}
.biglogo{width:96px;height:96px;border-radius:30px;background:linear-gradient(145deg,var(--gold2),var(--gold) 60%,#8a6d12);display:grid;place-items:center;font-family:'Amiri',serif;font-size:64px;color:#1b1403;box-shadow:0 14px 50px rgba(201,162,39,.5);animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.loader h1{font-family:'Amiri',serif;font-size:34px;background:linear-gradient(90deg,var(--gold2),var(--gold3),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.loader small{color:var(--mut);font-size:13px}
.loader p{color:var(--mut);font-size:14px;line-height:1.9;margin-top:6px}
.bar{width:150px;height:3px;border-radius:9px;background:rgba(247,226,160,.12);overflow:hidden}
.bar::after{content:"";display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--gold2),transparent);animation:slide 1.1s infinite}
@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.toast{position:absolute;top:calc(env(safe-area-inset-top) + 156px);left:50%;transform:translate(-50%,-10px);z-index:30;padding:10px 22px;border-radius:99px;font-size:13px;font-weight:700;color:var(--gold2);opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
input[type=range]{width:100%;accent-color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <div class="vig"></div>

  <div class="top">
    <div class="brand">
      <div class="logo">م</div>
      <div><b>محل مقداد</b><small>لمواد الحلويات والتغليف</small></div>
    </div>
    <div class="chip glass" id="count">0 منتج</div>
  </div>

  <div class="modes glass">
    <button id="mLook" class="on">🔍 معرفة السعر</button>
    <button id="mReg">➕ تسجيل منتج</button>
  </div>
  <div class="ai glass" id="ai"></div>

  <div class="frame" id="frame"><i></i><i></i><i></i><i></i><u></u></div>

  <div class="dock">
    <div class="card glass" id="card">
      <button class="xclose" id="xclose" style="display:none">✕</button>
      <div class="st idle on" id="sIdle"><b id="idleT">وجّه الكاميرا نحو المنتج</b><span id="idleS">سيظهر السعر تلقائياً</span></div>
      <div class="st" id="sFound">
        <span class="tag live" id="fTag">مطابقة مباشرة</span>
        <div class="fname" id="fName">—</div>
        <div class="frow">
          <div class="price"><span id="fPrice">0</span><small id="fCur">دج</small></div>
          <div class="stock">الكمية<b id="fStock">—</b></div>
        </div>
        <button class="minibtn" id="teach">📷 علّمه صورة أخرى لدقة أعلى</button>
      </div>
      <div class="st" id="sUnknown" style="text-align:center">
        <span class="tag no">غير مسجل</span>
        <div class="idle" style="margin-top:2px">لم أتعرف على هذا المنتج</div>
        <button class="minibtn" id="goReg">➕ سجّل هذا المنتج الآن</button>
      </div>
    </div>
    <div class="controls">
      <button class="side glass" id="invBtn">📦</button>
      <button class="shutter" id="shutter"><span id="shutIcon">🔍</span></button>
      <button class="side glass" id="setBtn">⚙️</button>
    </div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="toast glass" id="toast"></div>
  <div class="back" id="back"></div>

  <!-- تسجيل / تعديل -->
  <div class="sheet" id="sheet">
    <div class="shbody">
      <div class="grab"></div>
      <h3 id="shTitle">منتج جديد</h3>
      <div class="thumbs" id="shThumbs"></div>
      <label class="f">اسم المنتج</label>
      <input type="text" id="inName" placeholder="مثال: علبة كرتون كيك 25×25" autocomplete="off">
      <div class="two">
        <div><label class="f">السعر</label><input type="text" id="inPrice" inputmode="decimal" placeholder="0" autocomplete="off"></div>
        <div><label class="f">الكمية (اختياري)</label><input type="text" id="inStock" placeholder="—" autocomplete="off"></div>
      </div>
      <div class="err" id="shErr"></div>
    </div>
    <div class="shfoot">
      <button class="pbtn" id="save">💾 حفظ المنتج</button>
      <button class="gbtn red" id="del" style="display:none">🗑 حذف المنتج</button>
      <button class="gbtn" id="cancel">إلغاء</button>
    </div>
  </div>

  <!-- الإعدادات -->
  <div class="sheet" id="settings">
    <div class="shbody">
      <div class="grab"></div>
      <h3>الإعدادات</h3>
      <label class="f">العملة</label>
      <input type="text" id="inCur">
      <label class="f">صرامة التعرف: <b id="thrV" style="color:var(--gold2)"></b> (أعلى = أدق وأقل تساهلاً)</label>
      <input type="range" id="thr" min="65" max="95" step="1">
      <button class="gbtn" id="exp">⬇️ نسخة احتياطية</button>
      <button class="gbtn" id="imp">⬆️ استرجاع نسخة</button>
      <button class="gbtn red" id="wipe">مسح كل المنتجات</button>
      <input type="file" id="file" accept=".json" style="display:none">
    </div>
    <div class="shfoot"><button class="pbtn" id="setOk">تم</button></div>
  </div>

  <!-- المخزن -->
  <div class="inv" id="inv">
    <div class="invh"><h2>📦 منتجات المحل</h2><button class="x glass" id="invX">✕</button></div>
    <input type="search" id="q" placeholder="🔎 ابحث بالاسم...">
    <div class="list" id="list"></div>
  </div>

  <div class="loader" id="loader">
    <div class="biglogo">م</div>
    <h1>محل مقداد</h1>
    <small>لمواد الحلويات والتغليف</small>
    <div class="bar" id="ring"></div>
    <p id="loadTxt">جاري تشغيل الكاميرا...</p>
    <button class="pbtn" id="retry" style="display:none;max-width:260px" onclick="location.reload()">🔄 إعادة المحاولة</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY='pp2_products', CK='pp2_cur', TK='pp2_thr';
  const video=$('video');
  let model=null, ready=false, busy=false, mode='look';
  let products=[], thr=0.80;

  const fixSamples=p=>{ p.samples=(p.samples||[]).map(s=>{ if(!s) return null; if(typeof s.e==='string') return {m:s}; if(s.f||s.m) return s; return null; }).filter(Boolean); return p; };
  try{ products=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(products)) products=[]; }catch(e){ products=[]; }
  products=products.filter(p=>p&&typeof p==='object').map(fixSamples);
  try{ const t=parseFloat(localStorage.getItem(TK)); if(t>=0.65&&t<=0.95) thr=t; }catch(e){}
  const cur=()=>{ try{return localStorage.getItem(CK)||'دج'}catch(e){return 'دج'} };

  function save(){
    $('count').textContent=products.length+' منتج';
    try{ localStorage.setItem(KEY,JSON.stringify(products)); return true; }
    catch(e){
      products.forEach(p=>{ p.samples=p.samples.slice(-3); });
      try{ localStorage.setItem(KEY,JSON.stringify(products)); return true; }catch(e2){ return false; }
    }
  }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const buzz=ms=>{ try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){} };
  function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2300); }
  function flash(){ const f=$('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),70); }
  const fmt=p=>{ const n=Number(p); return isFinite(n)? n.toLocaleString('en-US',{maximumFractionDigits:2}) : p; };
  function setAi(t,hide){ const a=$('ai'); a.style.opacity=1; a.textContent=t; clearTimeout(a._t); if(hide) a._t=setTimeout(()=>a.style.opacity=0,hide); }

  function parsePrice(s){
    s=String(s||'').trim()
      .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
      .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
      .replace(/٫/g,'.').replace(/\s/g,'');
    if(/^\d{1,3}([,،]\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/[,،]/g,'');
    else s=s.replace(/[,،]/g,'.');
    if(s==='') return null;
    const n=Number(s); return (isFinite(n)&&n>=0)?n:null;
  }

  /* ---------- الكاميرا ---------- */
  async function startCam(){
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:720}},audio:false});
    video.srcObject=s; await video.play().catch(()=>{});
  }

  /* ---------- البصمة ---------- */
  const cv=document.createElement('canvas'); cv.width=cv.height=224;
  const cctx=cv.getContext('2d');
  const sm=document.createElement('canvas'); sm.width=sm.height=16;
  const sctx=sm.getContext('2d',{willReadFrequently:true});

  function normInto(arr,w,eps){
    let n=0; for(let i=0;i<arr.length;i++) n+=arr[i]*arr[i];
    n=Math.sqrt(n)+eps; const k=Math.sqrt(w)/n; for(let i=0;i<arr.length;i++) arr[i]*=k;
    return arr;
  }
  function fpVec(){
    sctx.drawImage(cv,0,0,224,224,0,0,16,16);
    const d=sctx.getImageData(0,0,16,16).data, N=256;
    const g=new Float32Array(N), cells=new Float32Array(48), hist=new Float32Array(15);
    let mean=0;
    for(let i=0;i<N;i++){
      const r=d[i*4]/255, gg=d[i*4+1]/255, b=d[i*4+2]/255;
      const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), df=mx-mn;
      g[i]=0.299*r+0.587*gg+0.114*b; mean+=g[i];
      const x=i%16, y=(i/16)|0, ci=((y>>2)*4+(x>>2))*3;
      cells[ci]+=r/16; cells[ci+1]+=gg/16; cells[ci+2]+=b/16;
      if(df/(mx||1)<0.2){ hist[12+Math.min(2,Math.floor(mx*3))]+=1; }
      else{
        let h; if(mx===r) h=((gg-b)/df)%6; else if(mx===gg) h=(b-r)/df+2; else h=(r-gg)/df+4;
        h=(h*60+360)%360; hist[Math.min(11,Math.floor(h/30))]+=1;
      }
    }
    mean/=N; for(let i=0;i<N;i++) g[i]-=mean;
    const cm=[0,0,0]; for(let i=0;i<48;i++) cm[i%3]+=cells[i]/16; for(let i=0;i<48;i++) cells[i]-=cm[i%3];
    for(let i=0;i<15;i++) hist[i]=Math.sqrt(hist[i]/N);
    normInto(g,0.4,0.01); normInto(cells,0.4,0.02); normInto(hist,0.2,0.0001);
    const out=new Float32Array(N+48+15); out.set(g,0); out.set(cells,N); out.set(hist,N+48);
    return out;
  }
  async function embed(){
    const vw=video.videoWidth, vh=video.videoHeight; if(!vw) return null;
    const side=Math.min(vw,vh)*0.75, sx=(vw-side)/2, sy=(vh-side)/2;
    cctx.drawImage(video,sx,sy,side,side,0,0,224,224);
    const f=fpVec();
    let m=null;
    if(model){
      try{
        const t=tf.tidy(()=>model.infer(cv,true)); const d=await t.data(); t.dispose();
        let n=0; for(let i=0;i<d.length;i++) n+=d[i]*d[i]; n=Math.sqrt(n)||1;
        m=new Float32Array(d.length); for(let i=0;i<d.length;i++) m[i]=d[i]/n;
      }catch(e){ m=null; }
    }
    return {f,m};
  }
  function thumb(){
    const t=document.createElement('canvas'); t.width=t.height=88;
    t.getContext('2d').drawImage(cv,0,0,224,224,0,0,88,88);
    return t.toDataURL('image/jpeg',0.6);
  }
  function enc(v){
    let m=0; for(let i=0;i<v.length;i++) m=Math.max(m,Math.abs(v[i])); m=m||1;
    let s=''; for(let i=0;i<v.length;i++) s+=String.fromCharCode(Math.round(v[i]/m*127)&255);
    return {e:btoa(s), m:+m.toFixed(6)};
  }
  const cache=new WeakMap();
  function dec(part){
    let c=cache.get(part); if(c) return c;
    const s=atob(part.e), o=new Float32Array(s.length); let n=0;
    for(let i=0;i<s.length;i++){ let b=s.charCodeAt(i); if(b>127) b-=256; o[i]=b*part.m/127; n+=o[i]*o[i]; }
    n=Math.sqrt(n)||1; for(let i=0;i<o.length;i++) o[i]/=n;
    cache.set(part,o); return o;
  }
  const dot=(a,b)=>{ if(a.length!==b.length) return 0; let s=0; for(let i=0;i<a.length;i++) s+=a[i]*b[i]; return s; };

  function match(q){
    let best=null,bs=0,second=0;
    for(const p of products){
      let s=0;
      for(const smp of p.samples){
        let sc=0;
        try{
          if(q.m && smp.m) sc=dot(q.m,dec(smp.m));
          else if(smp.f) sc=dot(q.f,dec(smp.f))+0.08;
        }catch(e){ sc=0; }
        if(sc>s) s=sc;
      }
      if(s>bs){ second=bs; bs=s; best=p; } else if(s>second) second=s;
    }
    const ok=!!best && bs>=thr && (products.length===1 || bs-second>=0.03);
    return {best,bs,ok};
  }
  async function burst(n){
    const out=[]; let th='';
    for(let i=0;i<n;i++){
      const v=await embed(); if(!v) continue;
      if(!th) th=thumb();
      const s={f:enc(v.f)}; if(v.m) s.m=enc(v.m);
      out.push(s); flash(); buzz(25);
      if(i<n-1) await sleep(130);
    }
    return {samples:out, thumb:th};
  }

  /* ---------- بطاقة النتيجة ---------- */
  let cardKey='', shown=null, live=false, lastId=null;
  function animatePrice(el,to){
    const n=Number(to);
    cancelAnimationFrame(el._r);
    if(!isFinite(n)){ el.textContent=to; return; }
    const t0=performance.now(), d=380;
    const step=t=>{
      const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3);
      el.textContent = k<1 ? fmt(Math.round(n*e)) : fmt(n);
      if(k<1) el._r=requestAnimationFrame(step);
    };
    el._r=requestAnimationFrame(step);
  }
  function render(state,p,variant){
    const key=state+(p?(p.id+'|'+p.price+'|'+p.name+'|'+(p.stock||'')):'')+(variant||'')+mode;
    if(key===cardKey) return; cardKey=key;
    ['sIdle','sFound','sUnknown'].forEach(i=>$(i).classList.remove('on'));
    const hit = state==='found' && variant==='live';
    const fr=$('frame');
    if(hit && !fr.classList.contains('hit')){ fr.classList.remove('hit'); void fr.offsetWidth; }
    fr.classList.toggle('hit',hit);
    $('xclose').style.display = state==='idle' ? 'none' : '';
    if(state==='found'){
      $('sFound').classList.add('on');
      $('fName').textContent=p.name;
      $('fCur').textContent=cur();
      $('fStock').textContent=p.stock||'—';
      if(lastId!==p.id || variant==='saved') animatePrice($('fPrice'),p.price); else $('fPrice').textContent=fmt(p.price);
      lastId=p.id;
      const tg=$('fTag');
      if(variant==='saved'){ tg.className='tag saved'; tg.textContent='✔ تم حفظ المنتج'; }
      else if(variant==='live'){ tg.className='tag live'; tg.textContent= mode==='reg' ? 'مسجل مسبقاً — صوّره لتحديث السعر' : 'مطابقة مباشرة'; }
      else { tg.className='tag hold'; tg.textContent='آخر منتج تم التعرف عليه'; }
      $('teach').style.display = (variant==='live' && mode==='look') ? '' : 'none';
    }else if(state==='unknown'){
      $('sUnknown').classList.add('on');
      $('goReg').style.display = mode==='reg' ? 'none' : '';
    }else{
      $('sIdle').classList.add('on');
      $('idleT').textContent = mode==='reg' ? 'وضع التسجيل' : 'وجّه الكاميرا نحو المنتج';
      $('idleS').textContent = mode==='reg' ? 'ضع المنتج داخل الإطار واضغط الزر الذهبي' : 'سيظهر السعر تلقائياً • أو اضغط الزر الذهبي';
    }
    const card=$('card'); card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  }
  $('xclose').onclick=()=>{ shown=null; live=false; lastId=null; stable={id:null,n:0}; cardKey=''; render('idle'); };

  /* ---------- حلقة التعرف الحي ---------- */
  let stable={id:null,n:0}, misses=0;
  const blocked=()=>document.querySelector('.sheet.on,.inv.on')||document.hidden;
  async function loop(){
    if(ready && !busy && !blocked() && products.length){
      busy=true;
      try{
        const v=await embed();
        if(v){
          const r=match(v);
          if(r.ok){
            misses=0;
            if(stable.id===r.best.id) stable.n++; else stable={id:r.best.id,n:1};
            if(stable.n>=2 || r.bs>=thr+0.07){
              if(!shown || shown.id!==r.best.id || !live) buzz(35);
              shown=r.best; live=true; render('found',r.best,'live');
            }
          }else{
            stable={id:null,n:0}; misses++;
            if(live && misses>=2 && shown){ live=false; render('found',shown,'held'); }
          }
        }
      }catch(e){}
      busy=false;
    }else if(ready && !products.length && !busy && !shown){
      render('idle');
    }
    setTimeout(loop,40);
  }

  /* ---------- الأزرار ---------- */
  function setMode(m){
    mode=m; cardKey=''; stable={id:null,n:0}; misses=0; live=false;
    $('mLook').classList.toggle('on',m==='look'); $('mReg').classList.toggle('on',m==='reg');
    $('shutIcon').textContent = m==='look' ? '🔍' : '📷';
    if(shown) render('found',shown,'held'); else render('idle');
  }
  $('mLook').onclick=()=>setMode('look');
  $('mReg').onclick=()=>setMode('reg');
  $('goReg').onclick=()=>setMode('reg');

  let pending=null, target=null, editing=null;
  $('shutter').onclick=async()=>{
    if(!ready){ toast('الكاميرا غير جاهزة بعد'); return; }
    while(busy) await sleep(30);
    busy=true;
    try{
      if(mode==='look'){
        flash();
        const v=await embed(); if(!v){ toast('الكاميرا غير جاهزة'); return; }
        if(!products.length){ toast('لا توجد منتجات، سجّل أولاً'); setMode('reg'); return; }
        const r=match(v);
        if(r.ok){ shown=r.best; live=true; stable={id:r.best.id,n:2}; buzz(50); render('found',r.best,'live'); }
        else{ shown=null; live=false; lastId=null; buzz(90); render('unknown'); }
      }else{
        const pre=await embed();
        const known = pre && products.length ? match(pre) : null;
        const b=await burst(3);
        if(!b.samples.length){ toast('الكاميرا غير جاهزة'); return; }
        pending=b; target = known && known.ok ? known.best : null;
        openSheet(target);
      }
    } finally { busy=false; }
  };
  $('teach').onclick=async()=>{
    if(!shown||!live) return;
    while(busy) await sleep(30);
    busy=true;
    try{
      const b=await burst(2);
      if(b.samples.length){ shown.samples.push(...b.samples); shown.samples=shown.samples.slice(-8); save(); toast('✔ تم تحسين التعرف'); }
    } finally { busy=false; }
  };

  /* ---------- النوافذ ---------- */
  function showBack(on){ $('back').classList.toggle('on',on); }
  function closeAll(){ document.activeElement&&document.activeElement.blur&&document.activeElement.blur(); document.querySelectorAll('.sheet.on,.inv.on').forEach(e=>e.classList.remove('on')); showBack(false); }
  $('back').onclick=closeAll; $('cancel').onclick=()=>{ pending=null; closeAll(); };

  function adjust(){
    const vv=window.visualViewport; if(!vv) return;
    const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
    document.querySelectorAll('.sheet').forEach(s=>{ s.style.bottom=kb+'px'; s.style.maxHeight=Math.max(260,vv.height-20)+'px'; });
  }
  if(window.visualViewport){ visualViewport.addEventListener('resize',adjust); visualViewport.addEventListener('scroll',adjust); }
  document.addEventListener('focusin',e=>{ if(e.target.tagName==='INPUT') setTimeout(()=>{ try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){} },320); });

  function setErr(m){ const e=$('shErr'); e.textContent=m||''; if(m){ e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); buzz(80); } }

  function openSheet(p,edit){
    editing = edit ? p : null;
    setErr('');
    $('shTitle').textContent = edit ? 'تعديل المنتج' : (p ? 'تحديث منتج مسجل' : 'منتج جديد');
    $('inName').value = p ? p.name : ''; $('inPrice').value = p ? p.price : ''; $('inStock').value = p ? (p.stock||'') : '';
    $('del').style.display = edit ? '' : 'none';
    const th=$('shThumbs'); th.innerHTML='';
    if(pending && !edit){
      const i=document.createElement('img'); i.src=pending.thumb; th.appendChild(i);
      const c=document.createElement('span'); c.style.cssText='font-size:12px;color:var(--mut)'; c.textContent='تم التقاط '+pending.samples.length+' لقطات'; th.appendChild(c);
    }else if(edit && p.thumb){ const i=document.createElement('img'); i.src=p.thumb; th.appendChild(i); }
    adjust();
    $('sheet').classList.add('on'); showBack(true);
    setTimeout(()=>{ (p?$('inPrice'):$('inName')).focus(); },340);
  }

  function doSave(){
    const name=$('inName').value.trim(), stock=$('inStock').value.trim();
    const price=parsePrice($('inPrice').value);
    if(!name){ setErr('⚠️ اكتب اسم المنتج'); $('inName').focus(); return; }
    if(price===null){ setErr('⚠️ اكتب السعر بالأرقام (مثال: 1200)'); $('inPrice').focus(); return; }
    let p = editing || target; const isNew=!p;
    if(!p && !(pending && pending.samples.length)){ setErr('⚠️ لا توجد صورة، أغلق وأعد الالتقاط'); return; }
    if(p){ p.name=name; p.price=String(price); p.stock=stock; }
    else{
      p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,price:String(price),stock,thumb:pending.thumb,samples:[]};
      products.unshift(p);
    }
    if(!editing && pending){ p.samples.push(...pending.samples); p.samples=p.samples.slice(-8); if(!p.thumb) p.thumb=pending.thumb; }
    if(!save()){
      if(isNew) products=products.filter(x=>x!==p);
      setErr('⚠️ ذاكرة الجهاز ممتلئة. احذف بعض المنتجات أو خذ نسخة احتياطية.'); return;
    }
    renderList(); closeAll(); buzz([40,40,60]);
    pending=null; target=null; editing=null;
    shown=p; live=false; stable={id:null,n:0}; lastId=null; cardKey='';
    render('found',p,'saved');
  }
  $('save').onclick=doSave;
  ['inName','inPrice','inStock'].forEach(i=>$(i).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); doSave(); } }));
  $('inPrice').addEventListener('input',()=>setErr(''));
  $('inName').addEventListener('input',()=>setErr(''));

  $('del').onclick=()=>{
    if(editing && confirm('حذف '+editing.name+'؟')){
      if(shown===editing){ shown=null; live=false; lastId=null; }
      products=products.filter(x=>x!==editing); save(); renderList(); closeAll(); editing=null; cardKey=''; render('idle');
    }
  };

  /* ---------- المخزن ---------- */
  function renderList(){
    const q=$('q').value.trim(), box=$('list'); box.innerHTML='';
    const l=products.filter(p=>!q||p.name.includes(q));
    if(!l.length){ box.innerHTML='<div class="empty">'+(products.length?'لا توجد نتائج':'لا توجد منتجات بعد<br>اختر «تسجيل منتج» وصوّر أول منتج')+'</div>'; return; }
    l.forEach(p=>{
      const b=document.createElement('button'); b.className='it glass';
      const im=document.createElement('img'); if(p.thumb) im.src=p.thumb;
      const n=document.createElement('div'); n.className='n';
      const t=document.createElement('b'); t.textContent=p.name;
      const s=document.createElement('span'); s.textContent=(p.stock?p.stock+' • ':'')+p.samples.length+' لقطات';
      n.append(t,s);
      const pr=document.createElement('div'); pr.className='p'; pr.textContent=fmt(p.price)+' '+cur();
      b.append(im,n,pr);
      b.onclick=()=>{ pending=null; target=null; $('inv').classList.remove('on'); openSheet(p,true); };
      box.appendChild(b);
    });
  }
  $('q').oninput=renderList;
  $('invBtn').onclick=()=>{ renderList(); $('inv').classList.add('on'); };
  $('invX').onclick=()=>{ $('inv').classList.remove('on'); };

  /* ---------- الإعدادات ---------- */
  $('setBtn').onclick=()=>{ $('inCur').value=cur(); $('thr').value=Math.round(thr*100); $('thrV').textContent=Math.round(thr*100)+'%'; adjust(); $('settings').classList.add('on'); showBack(true); };
  $('thr').oninput=e=>{ thr=e.target.value/100; $('thrV').textContent=e.target.value+'%'; try{localStorage.setItem(TK,thr)}catch(err){} };
  $('setOk').onclick=()=>{ try{localStorage.setItem(CK,$('inCur').value.trim()||'دج')}catch(e){} cardKey=''; renderList(); if(shown) render('found',shown,live?'live':'held'); closeAll(); };
  $('exp').onclick=()=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(products)],{type:'application/json'}));
    a.download='maqdad-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  };
  $('imp').onclick=()=>$('file').click();
  $('file').onchange=e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(Array.isArray(d)){ products=d.filter(p=>p&&typeof p==='object').map(fixSamples); save(); renderList(); shown=null; live=false; cardKey=''; render('idle'); toast('✔ تم الاسترجاع'); } else toast('ملف غير صالح'); }catch(err){ toast('ملف غير صالح'); } };
    r.readAsText(f);
  };
  $('wipe').onclick=()=>{ if(confirm('مسح كل المنتجات نهائياً؟')){ products=[]; save(); renderList(); shown=null; live=false; lastId=null; cardKey=''; render('idle'); toast('تم المسح'); } };

  /* ---------- تحميل الذكاء الاصطناعي (في الخلفية) ---------- */
  function loadScript(urls){
    return new Promise((res,rej)=>{
      let i=0;
      const next=()=>{
        if(i>=urls.length) return rej(new Error('load'));
        const s=document.createElement('script'); s.src=urls[i++]; s.async=true;
        s.onload=()=>res(); s.onerror=()=>{ s.remove(); next(); };
        document.head.appendChild(s);
      };
      next();
    });
  }
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);

  async function loadAI(){
    setAi('⏳ جاري تحميل الذكاء الاصطناعي...');
    try{
      await withTimeout(loadScript(['https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js','https://unpkg.com/@tensorflow/tfjs@4.22.0/dist/tf.min.js']),40000);
      await withTimeout(loadScript(['https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js','https://unpkg.com/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js']),40000);
      try{ await tf.setBackend('webgl'); }catch(e){}
      await tf.ready();
      const m=await withTimeout(mobilenet.load({version:2,alpha:0.5}),60000);
      for(let i=0;i<2;i++) tf.tidy(()=>m.infer(tf.zeros([224,224,3]),true));
      model=m;
      setAi('✔ الذكاء الاصطناعي جاهز',2500);
    }catch(e){
      model=null;
      setAi('⚠️ وضع أساسي (تأكد من الإنترنت لدقة أعلى)',6000);
    }
  }

  /* ---------- التشغيل ---------- */
  function fail(html){
    $('loadTxt').innerHTML=html; $('ring').style.display='none'; $('retry').style.display='block';
  }
  async function init(){
    save(); setMode('look');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext){
      fail('الكاميرا لا تعمل هنا.<br>افتح التطبيق عبر رابط <b style="font-size:15px">https</b> (مثل Netlify أو GitHub Pages)،<br>وليس بفتح الملف مباشرة من الهاتف.');
      return;
    }
    try{ await startCam(); }
    catch(e){
      fail('تعذّر تشغيل الكاميرا.<br>اسمح للمتصفح باستخدام الكاميرا من الإعدادات، ثم أعد المحاولة.');
      return;
    }
    ready=true;
    setTimeout(()=>{ $('loader').classList.add('off'); setTimeout(()=>$('loader').style.display='none',700); },500);
    loop();
    loadAI();
  }
  init();
})();
</script>
</body>
